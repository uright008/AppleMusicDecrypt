name: Flutter Android

on:
  pull_request:
    paths:
      - "flutter_app/**"
      - ".github/workflows/android-flutter.yml"
  push:
    branches: [v2]
    paths:
      - "flutter_app/**"
      - ".github/workflows/android-flutter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: AppleMusicDecrypt-Android-debug
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
